# Local Postgres for development. Run: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourdao
      POSTGRES_PASSWORD: ourdao
      POSTGRES_DB: ourdao
    ports:
      - '5432:5432'
    volumes:
      - ourdao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ourdao']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ourdao_pgdata:
